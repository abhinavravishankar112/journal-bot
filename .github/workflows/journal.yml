name: Daily journal

# Drafts today's journal and emails a prefilled form link. It never signs into
# Google: a session exported to a datacenter IP was revoked by Google within minutes.
on:
  # GitHub starts scheduled runs late under load — one started 4h40m late, past
  # midnight IST. Several attempts give one a chance to land on time; the gate
  # step below makes every attempt after the first a no-op.
  schedule:
    - cron: "35 12 * * *" # 18:05 IST
    - cron: "5 13 * * *" # 18:35 IST
    - cron: "35 13 * * *" # 19:05 IST
    - cron: "35 14 * * *" # 20:05 IST
    - cron: "35 15 * * *" # 21:05 IST
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: journal

jobs:
  journal:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Kolkata # today() and holidays are local dates
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      GH_TOKEN: ${{ secrets.GH_PAT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Without Gmail the journal falls back to printing on stdout — public logs on this repo.
      - name: Require secrets
        run: |
          for s in GH_TOKEN GEMINI_API_KEY GMAIL_USER GMAIL_APP_PASSWORD; do
            [ -n "${!s}" ] || { echo "::error::Missing secret for $s — see README 'Running remotely'"; exit 1; }
          done

      - run: npm ci

      - name: Gate scheduled runs
        id: gate
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$(date +%H)" -lt 12 ]; then
            echo "late=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Evening runs only: a late run after midnight is dated the same day but sent nothing.
          done_today=$(gh run list -R "$GITHUB_REPOSITORY" --workflow journal.yml --event schedule \
            --status success -L 20 --json createdAt \
            -q "[.[] | .createdAt | fromdateiso8601 + 19800 | strftime(\"%Y-%m-%d %H\")
                | select(startswith(\"$(date +%F)\") and (.[11:13] | tonumber) >= 12)] | length")
          [ "$done_today" -gt 0 ] && echo "done=true" >> "$GITHUB_OUTPUT" || true

      - name: Alert that the run started after midnight
        if: steps.gate.outputs.late == 'true'
        run: |
          node --input-type=module -e '
            import { sendAlert } from "./src/email.js";
            await sendAlert(
              `⚠️ Journal bot ran too late — GitHub started it at ${new Date().toTimeString().slice(0, 5)} IST`,
              "GitHub delayed every scheduled run past midnight, so no link was sent for yesterday. " +
                "If you have not filled yesterday'"'"'s journal, do it now from the form."
            );'

      - if: steps.gate.outputs.late != 'true' && steps.gate.outputs.done != 'true'
        run: node src/index.js --link

      # GitHub disables scheduled workflows after 60 days without repo activity.
      - name: Keep the schedule alive
        run: gh workflow enable journal.yml -R ${{ github.repository }}
        env:
          GH_TOKEN: ${{ github.token }}
